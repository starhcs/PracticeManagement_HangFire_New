name: PR Validation

on:
  pull_request:
    branches:
      - development

jobs:
  build-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore HangfireNew.sln

      - name: Build solution
        run: dotnet build HangfireNew.sln --configuration Release --no-restore
